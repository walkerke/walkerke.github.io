  <style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05080b;font-family:Arial,Helvetica,sans-serif}.html-widget{width:100%!important;height:100%!important}

  <div id="opsearch" class="opsearch">
    <label for="opsearch-input">Search by operator</label>
    <div class="row">
      <input id="opsearch-input" type="text" list="opsearch-list" autocomplete="off" spellcheck="false" placeholder="e.g. Energy Transfer"/>

  <script>// Operator search for the Day 2 pipeline map.
// Filters every pipeline layer (glow, core, ghost) to operators whose name contains the typed text, and
// zooms to them. The filter goes in mapgl's "slider" filter slot (this map has no slider), so it composes
// with each layer's base filter and with the interactive legend instead of overwriting them.
function initOperatorSearch(map) {
  var box = document.getElementById("opsearch");
  var input = document.getElementById("opsearch-input");
  var list = document.getElementById("opsearch-list");
  var status = document.getElementById("opsearch-status");
  var clearBtn = document.getElementById("opsearch-clear");
  if (!box || box._ready) return;
  box._ready = true;

  var home = { center: map.getCenter(), zoom: map.getZoom() };
  var index = {};   // operator -> {miles, bbox}; built once from the statewide view
  var names = [];
  var timer = null;

  function layers() {
    return map.getStyle().layers.map(function (l) { return l.id; })
      .filter(function (id) { return /^(glow|core)-|^pipes-ghost$/.test(id); });
  }

  function extend(bb, coords) {
    if (typeof coords[0] === "number") {
      if (coords[0] < bb[0]) bb[0] = coords[0]; if (coords[1] < bb[1]) bb[1] = coords[1];
      if (coords[0] > bb[2]) bb[2] = coords[0]; if (coords[1] > bb[3]) bb[3] = coords[1];
    } else coords.forEach(function (c) { extend(bb, c); });
  }

  function buildIndex() {
    map.querySourceFeatures("pipes", { sourceLayer: "pipelines" }).forEach(function (f) {
      var op = f.properties.operator;
      if (!op) return;
      var e = index[op] || (index[op] = { miles: 0, bbox: [180, 90, -180, -90] });
      e.miles += +f.properties.length_miles || 0;
      extend(e.bbox, f.geometry.coordinates);
    });
    names = Object.keys(index).sort(function (a, b) { return index[b].miles - index[a].miles; });
    list.innerHTML = names.map(function (n) {
      return "<option value=\"" + n.replace(/&/g, "&amp;").replace(/"/g, "&quot;") + "\"></option>";
    }).join("");
    box.classList.add("ready");
  }

  function setFilter(expr) {
    var st = window._mapglEnsureLayerState(map);
    layers().forEach(function (id) {
      st.filterStack[id] = st.filterStack[id] || {};
      st.filterStack[id].slider = expr;
      window._mapglComposeFilter(map, id);
    });
  }

  function matches(q) {
    return names.filter(function (n) { return n.toUpperCase().indexOf(q) !== -1; });
  }

  function apply(zoom) {
    var q = input.value.trim().toUpperCase();
    clearBtn.style.visibility = q ? "visible" : "hidden";
    if (q.length < 2) {
      setFilter(null);
      status.textContent = q ? "Keep typing…" : "";
      return;
    }
    setFilter(["in", q, ["upcase", ["to-string", ["get", "operator"]]]]);
    var hit = matches(q);
    if (!hit.length) { status.textContent = "No operator names match"; return; }
    status.textContent = hit.length === 1 ? hit[0] : hit.length.toLocaleString() + " operators match";
    if (zoom) {
      var bb = [180, 90, -180, -90];
      hit.forEach(function (n) { extend(bb, [[index[n].bbox[0], index[n].bbox[1]], [index[n].bbox[2], index[n].bbox[3]]]); });
      map.fitBounds([[bb[0], bb[1]], [bb[2], bb[3]]], { padding: { top: 150, bottom: 60, left: 320, right: 60 }, maxZoom: 10, duration: 1200 });
    }
  }

  input.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { apply(false); }, 250); });
  input.addEventListener("change", function () { clearTimeout(timer); apply(true); });
  input.addEventListener("keydown", function (e) { if (e.key === "Escape") clearBtn.click(); });
  clearBtn.addEventListener("click", function () {
    input.value = ""; apply(false);
    map.flyTo({ center: home.center, zoom: home.zoom, duration: 1200 });
  });

  // index once the statewide view has fully loaded (every Texas tile is in view at the start)
  var tryIndex = function () {
    if (names.length) return;
    if (map.loaded() && map.areTilesLoaded()) buildIndex(); else map.once("idle", tryIndex);
  };
  map.once("idle", tryIndex);
}
</script>
